    ref_weights: {N2: [0.0, 0.20], C1: [0.10, 0.50], C2: [0.10, 0.50], C3: [0.0, 0.40], nC4: [0.0, 0.40], iC5: [0.0, 0.20]}
  n2_single:
    n_rated_mol_per_kg_lng: [100.0, 1200.0]   # rated N2 flow of the machines, mol per kg/s of LNG product
    P_high_bar: [30.0, 100.0]
    P_low_bar: [5.0, 20.0]
    flow_ratio: [2.0, 14.0]
    T_exp_in_C: [-130.0, -40.0]
    T_lng_C: [-165.0, -135.0]
    ua_kw_per_K_per_kgs: [10.0, 400.0]
  n2_dual:
    n_rated_mol_per_kg_lng: [100.0, 1200.0]
    P_high_bar: [30.0, 100.0]
    P_low_bar: [5.0, 20.0]
    flow_ratio: [2.0, 14.0]
    T_exp_in_warm_C: [-80.0, 0.0]
    T_exp_in_cold_C: [-140.0, -70.0]
    split: [0.2, 0.8]               # fraction of HP N2 sent to the warm expander
    T_lng_C: [-165.0, -135.0]
    ua_kw_per_K_per_kgs: [10.0, 400.0]
