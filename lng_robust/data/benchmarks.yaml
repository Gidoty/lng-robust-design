    feed_composition: null
    feed_flow_kg_s: null
    product_basis: null
    lng_storage_pressure_bar: null
    T_lng_C: null
    P_high_bar: null
    P_low_bar: null
    n2_flow_kg_s: null
    T_exp_in_warm_C: null
    T_exp_in_cold_C: null
    split: null                     # flow fraction to the warm expander; confirm the flowsheet topology too
    T_cool_C: null
    compressor_pr_max_per_stage: null
