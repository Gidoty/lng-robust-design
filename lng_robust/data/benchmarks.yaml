# Benchmark inputs. ONLY values stated in the task specification are filled. Every other field is null.
# A null is never guessed or substituted; validate.py prints BENCHMARK_INPUTS_INCOMPLETE for it.
# A value that the original paper states as "none / zero" must be entered as an explicit 0, with a note.
khan2015_n2_single:
  cycle: n2_single
  citation: "Khan, M.S., Lee, S., Getu, M., Lee, M., 2015. J. Nat. Gas Sci. Eng. 23, 324-337"
  published:
    sec_kwh_per_kg_lng: 0.7449
  published_basis:
    equation_of_state: Peng-Robinson
    eta_compressor: 0.75
    eta_expander: 0.75
    mita_K: 3.0
  inputs:
    feed_T_C: 30.0
    feed_P_bar: 50.0
    feed_composition: null          # mole fractions
    feed_flow_kg_s: null
    product_basis: null             # must be 'after_end_flash' for this code; anything else is not supported
    lng_storage_pressure_bar: null
    T_lng_C: null
    P_high_bar: null
    P_low_bar: null
    n2_flow_kg_s: null
    T_exp_in_C: null
    T_cool_C: null                  # compressor inter/after-cooler outlet temperature
    compressor_pr_max_per_stage: null
    dp_mshe_hp_bar: null
    dp_mshe_lp_bar: null
    dp_cooler_bar: null
    dp_intercooler_bar: null
khan2015_n2_dual:
  cycle: n2_dual
  citation: "Khan, M.S., Lee, S., Getu, M., Lee, M., 2015. J. Nat. Gas Sci. Eng. 23, 324-337"
