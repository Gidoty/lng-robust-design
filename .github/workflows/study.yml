name: study

# Phases 5 to 10 of the LNG robust-design study. Generated by tools/make_workflow.py: edit the generator, not this file.
# Every unit reads the artifacts of its predecessors, writes a checkpoint and Parquet shards, and uploads them as artifacts.
# Dependent stages are chained with needs:. A final job merges everything, builds the results package and commits it to results/<run_id>.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "probe (tiny, measures time per evaluation, numbers are NOT results) or full"
        default: "probe"
        type: choice
        options: [probe, full]
      seed:
        description: "global seed"
        default: "20260101"

permissions:
  contents: write

env:
  PRESET: ${{ inputs.preset }}
  SEED: ${{ inputs.seed }}
  PYTHONUNBUFFERED: "1"
  LNG_FLASH_CACHE_MAX: "30000"

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Full test suite
        run: python -m pytest -q

  nominal:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cycle: [smr, n2_single, n2_dual]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Run unit
        run: |
          mkdir -p work
          python -m lng_robust.study.cli nominal --cycle ${{ matrix.cycle }} --preset "$PRESET" --seed "$SEED" --work work --workers 4
      - name: Evaluation counts
        if: always()
        run: python -m lng_robust.study.counts "work/unit-nominal-${{ matrix.cycle }}" || true
      - name: Upload checkpoint and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-nominal-${{ matrix.cycle }}
          path: |
            work/unit-nominal-${{ matrix.cycle }}
            !work/unit-nominal-${{ matrix.cycle }}/evals-*.parquet
          retention-days: 90
          if-no-files-found: warn
      - name: Upload evaluation shards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shards-nominal-${{ matrix.cycle }}
          path: work/unit-nominal-${{ matrix.cycle }}/evals-*.parquet
          retention-days: 90
          if-no-files-found: ignore

